name: Build

# Builds gtodo from the private alminisl/GTodo source at a tag and publishes signed installers + latest.json
# (read by the in-app updater) to a draft release in this repo. Triggered by GTodo's release workflow
# (repository_dispatch) or by hand. Only the repo owner can trigger either, so secrets never reach fork PRs.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'GTodo tag to build, e.g. v0.1.2'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Tag looks like vX.Y.Z
        shell: bash
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Bad tag: $TAG"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          repository: alminisl/GTodo
          ref: ${{ env.TAG }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }} # read-only deploy key on alminisl/GTodo

      - name: Tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${TAG#v}" = "$v" ] || { echo "::error::Tag $TAG does not match package.json version $v"; exit 1; }

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libdbus-1-dev build-essential file rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }} # signs updater artifacts; key has no password
        with:
          commitish: main # tag is created in this repo, which doesn't have GTodo's commits
          tagName: ${{ env.TAG }}
          releaseName: gtodo ${{ env.TAG }}
          releaseBody: 'Installers for Windows (NSIS, MSI), macOS (universal dmg) and Linux (AppImage, deb, rpm). Unsigned builds.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
